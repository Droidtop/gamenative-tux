name: Push build check

# The fork's one and only CI: this fork commits straight to master, so
# every push gets verified here, and the same run publishes installable
# debug APK artifacts for both flavors. The inherited upstream workflows
# (Android CI signed releases, ad-hoc builds, tagged prereleases, the
# pull_request check) were deleted -- they depended on upstream's own
# keystore/Discord/analytics secrets and could never succeed in this
# fork, and everything the fork needs from CI happens right here.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Inject dummy credentials
        run: |
          cat <<EOF > local.properties
          POSTHOG_API_KEY=dummy
          POSTHOG_HOST=https://us.i.posthog.com
          EOF

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Assemble debug (legacy and modern flavors)
        run: ./gradlew :app:assembleLegacyDebug :app:assembleModernDebug --stacktrace

      - name: Run unit tests
        run: ./gradlew :app:testLegacyDebugUnitTest :app:testModernDebugUnitTest --stacktrace

      - name: Upload legacy debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gamenative-tux-legacy-debug
          path: app/build/outputs/apk/legacy/debug/*.apk

      - name: Upload modern debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gamenative-tux-modern-debug
          path: app/build/outputs/apk/modern/debug/*.apk
