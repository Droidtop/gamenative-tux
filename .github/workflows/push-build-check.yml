name: Push build check

# The real, inherited pluvia-pr-check.yml only triggers on pull_request --
# this fork commits straight to master (no PR workflow), so nothing
# actually verified those commits build until now. Same real steps
# pluvia-pr-check.yml already uses (dummy PostHog credentials, the same
# unit-test targets), just triggered on push instead.

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Inject dummy credentials
        run: |
          cat <<EOF > local.properties
          POSTHOG_API_KEY=dummy
          POSTHOG_HOST=https://us.i.posthog.com
          EOF

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug (legacy flavor)
        run: ./gradlew :app:assembleLegacyDebug --stacktrace

      - name: Run unit tests
        run: ./gradlew :app:testLegacyDebugUnitTest :app:testModernDebugUnitTest --stacktrace
