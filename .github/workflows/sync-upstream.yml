name: Sync upstream

# Real, daily upstream sync -- keeps this fork's master merged with
# utkarshdalal/GameNative's own master, so the real native-Linux work
# this fork adds (see README) doesn't silently drift out of date with
# upstream's own real fixes/driver updates.
#
# Uses a real git merge (not rebase, not a hard reset) -- if upstream and
# this fork's own commits genuinely conflict, the merge step fails the
# job outright rather than force-resolving or discarding anything; that
# needs a real person to look at it.
#
# Real, known limitation: this pushes using the default GITHUB_TOKEN,
# which GitHub deliberately does NOT let trigger other workflow runs (an
# intentional anti-recursion rule) -- so "Push build check"
# won't auto-fire off THIS workflow's own push. To get that, add a real
# Personal Access Token as a repo secret (e.g. SYNC_PAT) and swap the
# checkout/push steps below to use it instead of GITHUB_TOKEN.

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add upstream remote
        run: git remote add upstream https://github.com/utkarshdalal/GameNative.git

      - name: Fetch upstream
        run: git fetch upstream master

      - name: Configure commit identity for the merge commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge upstream/master
        run: git merge upstream/master --no-edit

      # This fork deliberately removed Google Play Integrity (and the
      # upstream-only signed-release workflows that depend on upstream's
      # own secrets). A merge conflict already catches upstream edits to
      # files we changed or deleted, but upstream can reintroduce the
      # same things in NEW files, which merges cleanly -- so fail the
      # sync here instead of silently pushing them back into the fork.
      - name: Refuse to sync removed-by-policy code back in
        run: |
          if grep -rn "PlayIntegrity\|play\.core\.integrity\|IntegrityManager\|CLOUD_PROJECT_NUMBER" app/src app/build.gradle.kts gradle/libs.versions.toml; then
            echo "::error::Upstream merge reintroduced Google Play Integrity. Resolve by hand (rip it out again), then push."
            exit 1
          fi
          for f in app-release-signed.yml adhoc-signed-build.yml tagged-release.yml pluvia-pr-check.yml; do
            if [ -e ".github/workflows/$f" ]; then
              echo "::error::Upstream merge restored removed workflow $f. Delete it again by hand, then push."
              exit 1
            fi
          done

      # The same tripwire idea for the fork's own keystone Linux work: a
      # merge can't silently delete files upstream never had, but this
      # makes that guarantee explicit -- if any of these ever goes missing
      # after a sync, something is genuinely wrong and a person must look.
      - name: Verify the fork's Linux work survived the merge
        run: |
          for f in \
            app/src/main/java/com/winlator/linux/LinuxContainerBackend.java \
            app/src/main/java/com/winlator/linux/LinuxContainerBackendRegistry.java \
            app/src/main/java/com/winlator/linux/DefaultProotContainerBackend.java \
            app/src/main/java/com/winlator/xenvironment/components/LinuxProgramLauncherComponent.java \
            app/src/main/java/app/gamenative/utils/SteamRuntime.kt \
            .github/workflows/push-build-check.yml; do
            if [ ! -e "$f" ]; then
              echo "::error::Fork keystone file $f is missing after the upstream merge. Investigate by hand before anything gets pushed."
              exit 1
            fi
          done
          if ! grep -q "preferLinuxDepots" app/src/main/java/app/gamenative/PrefManager.kt; then
            echo "::error::preferLinuxDepots is gone from PrefManager after the upstream merge. Investigate by hand."
            exit 1
          fi

      - name: Push if there's anything new
        run: |
          if git diff --quiet origin/master HEAD; then
            echo "Already up to date with upstream -- nothing to push."
          else
            git push origin HEAD:master
          fi
