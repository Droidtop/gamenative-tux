name: x86_64 software Vulkan

# Packs tools/x86_64-lavapipe into x86_64-lavapipe.tzst and publishes it as a
# release asset. The app downloads it on x86_64 devices when a container's
# graphics driver is lavapipe (app/gamenative/utils/X86_64Graphics.kt pins the
# tag and the SHA-256), the same way the x86_64 guest libraries are a download.
#
# A run on master publishes a release; a run on any other branch publishes a
# prerelease, so a branch the droidtop pin points at can carry its own build.

on:
  push:
    paths:
      - 'tools/x86_64-lavapipe/**'
      - '.github/workflows/x86_64-lavapipe.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  # The guest libraries this driver is loaded beside; libraries they already
  # provide are left out of the archive (see build.sh).
  GUEST_LIBS_TAG: x86_64-guest-libs-20261002-12f9f4d8

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils curl file python3 xz-utils zstd

      - name: Guest libraries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "$GUEST_LIBS_TAG" -R "$GITHUB_REPOSITORY" -p x86_64-guest-libs.tzst -D "$RUNNER_TEMP"

      - name: Build
        env:
          GUEST_LIBS: ${{ runner.temp }}/x86_64-guest-libs.tzst
          WORK: ${{ runner.temp }}/lavapipe
        run: |
          bash tools/x86_64-lavapipe/build.sh "$GITHUB_WORKSPACE/out/x86_64-lavapipe.tzst"
          cd out && sha256sum x86_64-lavapipe.tzst | tee x86_64-lavapipe.tzst.sha256

      - name: Upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: x86_64-lavapipe
          path: out/*
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-24.04
    # The only job that can write releases; it runs no build code.
    permissions:
      contents: write
    steps:
      - name: Download
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: x86_64-lavapipe
          path: out

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        run: |
          tag="x86_64-lavapipe-$(date -u +%Y%m%d)-${GITHUB_SHA::8}"
          pre=--prerelease
          [ "$BRANCH" = master ] && pre=
          gh release create "$tag" out/x86_64-lavapipe.tzst out/x86_64-lavapipe.tzst.sha256 \
            -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" $pre \
            --title "x86_64 software Vulkan ($tag)" \
            --notes "Khronos Vulkan loader and Mesa lavapipe for the x86_64 Wine guest, from Termux's x86_64 packages (tools/x86_64-lavapipe, packed from $BRANCH at $GITHUB_SHA; usr/share/doc/x86_64-lavapipe/PACKAGES lists every package and version). SHA-256: $(cut -d' ' -f1 out/x86_64-lavapipe.tzst.sha256)"
